<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Roblox Username Generator</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ff0000, #000000);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

.box {
    background: white;
    padding: 25px;
    width: 320px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}

h1 {
    margin-bottom: 15px;
}

input, select, button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

button {
    background: #ff0000;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #cc0000;
}

#result {
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
    color: #000;
}
</style>
</head>

<body>

<div class="box">
    <h1>Roblox Username Generator</h1>

    <input type="text" id="name" placeholder="Enter your name">

    <select id="style">
        <option value="cool">Cool</option>
        <option value="pro">Pro</option>
        <option value="funny">Funny</option>
    </select>

    <button onclick="generate()">Generate Username</button>

    <div id="result"></div>
</div>

<script>
function generate() {
    let name = document.getElementById("name").value;
    let style = document.getElementById("style").value;

    if (name === "") {
        name = "Player";
    }

    const cool = ["Xx", "Dark", "Shadow", "Fire", "Ice"];
    const pro = ["OP", "YT", "Pro", "King", "Legend"];
    const funny = ["Noob", "LOL", "XD", "Duck", "Banana"];

    let prefix = "";
    let suffix = Math.floor(Math.random() * 1000);

    if (style === "cool") {
        prefix = cool[Math.floor(Math.random() * cool.length)];
    } else if (style === "pro") {
        prefix = pro[Math.floor(Math.random() * pro.length)];
    } else {
        prefix = funny[Math.floor(Math.random() * funny.length)];
    }

    document.getElementById("result").innerText =
        prefix + name + suffix;
}
</script>

</body>
</html>
